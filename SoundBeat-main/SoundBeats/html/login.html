<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | SharedBeats</title>
    <link rel="stylesheet" href="/SoundBeats/css/css.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <span class="logo-gradient">SharedBeats</span>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>

        <form action="/SoundBeats/html/Index2.html">
            <label>Email</label>
            <input type="email" placeholder="tu@email.com" required>

            <label>Contraseña</label>
            <input type="password" placeholder="••••••••" required>

            <button type="submit" class="btn-primary full">Entrar</button>
        </form>

        <p class="auth-link">
            No tienes cuenta?
            <a href="register.html">Registrate</a>
        </p>
    </div>
</main>

</body>
</html>
