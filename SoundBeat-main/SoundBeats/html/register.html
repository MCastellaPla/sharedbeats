<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | SharedBeats</title>
    <link rel="stylesheet" href="/SoundBeats/css/css.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <span class="logo-gradient">SharedBeats</span>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h2>Crear Cuenta</h2>

        <form action="/SoundBeats/html/Index2.html">
            <label>Nombre de usuario</label>
            <input type="text" placeholder="Tu nombre artístico" required>

            <label>Email</label>
            <input type="email" placeholder="tu@email.com" required>

            <label>Contraseña</label>
            <input type="password" placeholder="••••••••" required>

            <label>Confirmar contraseña</label>
            <input type="password" placeholder="••••••••" required>

            <button type="submit" class="btn-primary full">Registrarse</button>
        </form>

        <p class="auth-link">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>
    </div>
</main>

</body>
</html>
